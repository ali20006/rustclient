name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'
inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: Install python deps
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyzipper

    - name: Decrypt and Mask
      shell: python
      env:
        ZIP_PASS: ${{ inputs.zip_password }}
        ZIP_PATH: ${{ inputs.zip_path }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        import sys
        import io
        import pyzipper
        import json
        import os

        sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding="utf-8", errors="replace")
        sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding="utf-8", errors="replace")

        zip_path = os.environ.get('ZIP_PATH', 'secrets.zip')
        zip_pass = os.environ.get('ZIP_PASS', '')

        if not os.path.exists(zip_path):
            print(f"::error::File not found: {zip_path}")
            print("Current directory files:", os.listdir('.'))
            sys.exit(1)

        try:
            with pyzipper.AESZipFile(zip_path) as zf:
                zf.setpassword(zip_pass.encode('utf-8'))
                with zf.open('secrets.json') as f:
                    secrets = json.load(f)

            with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
                for key, value in secrets.items():
                    if value:
                        print(f"::add-mask::{value}")
                        env_file.write(f"{key}={value}\n")
            
            print(f"Successfully masked {len(secrets)} secrets.")
        except Exception as e:
            print(f"::error::Failed to decrypt/process secrets: {str(e)}")
            sys.exit(1)
